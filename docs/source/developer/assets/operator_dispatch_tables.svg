<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-label="The three lists that must agree">
  <title>The three lists that must agree</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker></defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <rect x="30" y="40" width="260" height="150" rx="8" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="160.0" y="68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="bold" fill="#1e1e1e"><tspan x="160.0" dy="0">operator_visitor.hpp</tspan></text>
  <text x="46" y="96" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" fill="#1e1e1e"><tspan x="46" dy="0">TWO_PARTICLE_OVERLOADS</tspan><tspan x="46" dy="15.525">DENSITY_OVERLOADS</tspan><tspan x="46" dy="15.525"> </tspan><tspan x="46" dy="15.525">what can be visited</tspan></text>
  <rect x="310" y="40" width="260" height="150" rx="8" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="440.0" y="68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="bold" fill="#1e1e1e"><tspan x="440.0" dy="0">coulomb.cpp</tspan></text>
  <text x="326" y="96" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" fill="#1e1e1e"><tspan x="326" dy="0">template class</tspan><tspan x="326" dy="15.525">  Coulomb&lt;Electron,</tspan><tspan x="326" dy="15.525">          Nuclei&gt;;</tspan><tspan x="326" dy="15.525"> </tspan><tspan x="326" dy="15.525">what links</tspan></text>
  <rect x="590" y="40" width="260" height="150" rx="8" fill="#ebfbee" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="720.0" y="68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="bold" fill="#1e1e1e"><tspan x="720.0" dy="0">py_operator_dispatch.hpp</tspan></text>
  <text x="606" y="96" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="normal" fill="#1e1e1e"><tspan x="606" dy="0">two_particle_pairs</tspan><tspan x="606" dy="15.525">density_pairs</tspan><tspan x="606" dy="15.525"> </tspan><tspan x="606" dy="15.525">what Python can build</tspan></text>
  <text x="440" y="226" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#1e1e1e"><tspan x="440" dy="0">must agree, one for one</tspan></text>
  <line x1="290" y1="115" x2="305" y2="115" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="570" y1="115" x2="585" y2="115" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="30" y="250" width="820" height="190" rx="8" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="440" y="280" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#1e1e1e"><tspan x="440" dy="0">What happens when one of them is missing an entry</tspan></text>
  <text x="60" y="316" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" fill="#1e1e1e"><tspan x="60" dy="0">missing from the .cpp</tspan></text>
  <text x="340" y="316" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" fill="#5c5f66"><tspan x="340" dy="0">the extension module does not link</tspan></text>
  <text x="60" y="346" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" fill="#1e1e1e"><tspan x="60" dy="0">missing from operator_visitor.hpp</tspan></text>
  <text x="340" y="346" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" fill="#5c5f66"><tspan x="340" dy="0">builds, then throws the first time it is visited</tspan></text>
  <text x="60" y="376" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" fill="#1e1e1e"><tspan x="60" dy="0">missing from the binding table</tspan></text>
  <text x="340" y="376" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" fill="#5c5f66"><tspan x="340" dy="0">exists in C++, but nothing in Python can build it</tspan></text>
  <text x="440" y="414" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="normal" fill="#5c5f66"><tspan x="440" dy="0">Adding an instantiation means editing all three.</tspan></text>
</svg>
