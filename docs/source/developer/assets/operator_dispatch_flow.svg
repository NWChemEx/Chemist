<svg xmlns="http://www.w3.org/2000/svg" width="860" height="645" viewBox="0 0 860 645" role="img" aria-label="How Coulomb(Electron(), rho) reaches its instantiation">
  <title>How Coulomb(Electron(), rho) reaches its instantiation</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker></defs>
  <rect width="860" height="645" fill="#ffffff"/>
  <rect x="230" y="24" width="400" height="48" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="430" y="53.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" fill="#1e1e1e"><tspan x="430" dy="0">Coulomb(Electron(), rho)</tspan></text>
  <line x1="430" y1="72" x2="430" y2="104" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="230" y="104" width="400" height="66" rx="8" fill="#fff9db" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="430" y="142.0" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e"><tspan x="430" dy="0">Coulomb.__new__</tspan><tspan x="430" dy="17.55">returns an instance of another class</tspan></text>
  <text x="660" y="124" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="normal" fill="#5c5f66"><tspan x="660" dy="0">so PyObject_TypeCheck fails</tspan><tspan x="660" dy="16.200000000000003">and __init__ is skipped;</tspan><tspan x="660" dy="16.200000000000003">isinstance still works, via</tspan><tspan x="660" dy="16.200000000000003">virtual subclasses</tspan></text>
  <line x1="430" y1="170" x2="430" y2="202" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="230" y="202" width="400" height="62" rx="8" fill="#ebfbee" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="430" y="238.0" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e"><tspan x="430" dy="0">pass 1: exact type match</tspan><tspan x="430" dy="17.55">type(rho) is DecomposableDensity</tspan></text>
  <text x="660" y="228" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="normal" fill="#5c5f66"><tspan x="660" dy="0">this pass is why a</tspan><tspan x="660" dy="16.200000000000003">DecomposableDensity never</tspan><tspan x="660" dy="16.200000000000003">collapses into Density</tspan></text>
  <line x1="430" y1="264" x2="430" y2="296" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="452" y="288" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="normal" fill="#5c5f66"><tspan x="452" dy="0">hit</tspan></text>
  <rect x="60" y="202" width="140" height="62" rx="8" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="130" y="228" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e"><tspan x="130" dy="0">pass 2:</tspan><tspan x="130" dy="17.55">isinstance</tspan></text>
  <line x1="230" y1="233" x2="205" y2="233" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="6 4"/>
  <text x="130" y="288" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="normal" fill="#5c5f66"><tspan x="130" dy="0">only if pass 1</tspan><tspan x="130" dy="16.200000000000003">found nothing</tspan></text>
  <rect x="230" y="296" width="400" height="66" rx="8" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="430" y="334.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" fill="#1e1e1e"><tspan x="430" dy="0">Coulomb&lt;Electron,</tspan><tspan x="430" dy="17.55">        DecomposableDensity&lt;Electron&gt;&gt;</tspan></text>
  <line x1="430" y1="362" x2="430" y2="394" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="230" y="394" width="400" height="48" rx="8" fill="#ebfbee" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="430" y="423.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" fill="#1e1e1e"><tspan x="430" dy="0">_CoulombElectronDecomposableDensityElectron</tspan></text>
  <rect x="140" y="470" width="580" height="148" rx="8" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="430" y="498" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#1e1e1e"><tspan x="430" dy="0">A real C++ operator, not a placeholder</tspan></text>
  <text x="430" y="524" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" fill="#1e1e1e"><tspan x="430" dy="0">isinstance(op, Coulomb)  -&gt;  True</tspan></text>
  <text x="430" y="546" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" fill="#1e1e1e"><tspan x="430" dy="0">type(op)  -&gt;  the private class</tspan></text>
  <text x="430" y="582" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="normal" fill="#5c5f66"><tspan x="430" dy="0">It can be cloned, embedded in a Fock or Hamiltonian,</tspan><tspan x="430" dy="17.55">and dispatched through OperatorVisitor.</tspan></text>
</svg>
