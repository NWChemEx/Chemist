<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="Collapsing per-instantiation names into one class">
  <title>Collapsing per-instantiation names into one class</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker></defs>
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="220" y="34" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#1e1e1e"><tspan x="220" dy="0">Before: one Python class per C++ instantiation</tspan></text>
  <rect x="40" y="52" width="360" height="240" rx="8" fill="#ffe3e3" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="60" y="82" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" fill="#1e1e1e"><tspan x="60" dy="0">KineticElectron</tspan><tspan x="60" dy="16.200000000000003">KineticManyElectrons</tspan><tspan x="60" dy="16.200000000000003">KineticNuclues  (sic)</tspan><tspan x="60" dy="16.200000000000003">KineticNuclei</tspan><tspan x="60" dy="16.200000000000003">CoulombElectronElectron</tspan><tspan x="60" dy="16.200000000000003">CoulombManyElectronsManyElectrons</tspan><tspan x="60" dy="16.200000000000003">CoulombElectronDensityElectron</tspan><tspan x="60" dy="16.200000000000003">CoulombElectronDecomposableDensityElectron</tspan><tspan x="60" dy="16.200000000000003">CoulombElectronNuclei</tspan><tspan x="60" dy="16.200000000000003">ExchangeElectronDensityElectron</tspan><tspan x="60" dy="16.200000000000003">ExchangeCorrelationManyElectrons...</tspan><tspan x="60" dy="16.200000000000003">...  21 names in all</tspan></text>
  <text x="220" y="320" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="normal" fill="#5c5f66"><tspan x="220" dy="0">The caller must know which</tspan><tspan x="220" dy="17.55">instantiation its particle implies.</tspan></text>
  <text x="700" y="34" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#1e1e1e"><tspan x="700" dy="0">After: one class per operator</tspan></text>
  <rect x="520" y="52" width="320" height="150" rx="8" fill="#ebfbee" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="540" y="82" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" fill="#1e1e1e"><tspan x="540" dy="0">Kinetic</tspan><tspan x="540" dy="17.55">Coulomb</tspan><tspan x="540" dy="17.55">Exchange</tspan><tspan x="540" dy="17.55">ExchangeCorrelation</tspan></text>
  <text x="700" y="226" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="normal" fill="#5c5f66"><tspan x="700" dy="0">The particle picks the instantiation.</tspan></text>
  <rect x="520" y="252" width="320" height="100" rx="8" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="540" y="280" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" fill="#5c5f66"><tspan x="540" dy="0">_KineticElectron</tspan><tspan x="540" dy="16.200000000000003">_CoulombElectronDensityElectron</tspan><tspan x="540" dy="16.200000000000003">...  still exported, now private</tspan></text>
  <line x1="410" y1="150" x2="510" y2="120" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="460.0" y="127.0" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="normal" fill="#5c5f66"><tspan x="460.0" dy="0">collapse</tspan></text>
  <line x1="410" y1="250" x2="510" y2="292" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="460.0" y="263.0" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="normal" fill="#5c5f66"><tspan x="460.0" dy="0">renamed</tspan></text>
</svg>
